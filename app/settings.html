<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/settings.css" />
    <script type="module" src="/src/settings.ts" defer></script>
    <title>Réglages de pet-claude</title>
  </head>
  <body>
    <header>
      <div class="logo" aria-hidden="true"></div>
      <div>
        <h1>pet-claude</h1>
        <p>Ton compagnon pour Claude Code</p>
      </div>
    </header>

    <section>
      <h2>Comportement</h2>
      <label class="row">
        <span>Le pet reparle après <output id="cooldown-out"></output></span>
        <input id="cooldownSec" type="range" min="0" max="60" step="1" />
      </label>
      <label class="row">
        <span>S'endort après <output id="sleep-out"></output></span>
        <input id="sleepAfterSec" type="range" min="10" max="600" step="10" />
      </label>
      <label class="row switch"><span>Confettis après un gros travail</span><input id="confetti" type="checkbox" /></label>
    </section>

    <section>
      <h2>Sons</h2>
      <label class="row switch"><span>Activer les sons</span><input id="sound" type="checkbox" /></label>
      <label class="row">
        <span>Volume <output id="volume-out"></output></span>
        <input id="volume" type="range" min="0" max="1" step="0.05" />
      </label>
    </section>

    <section>
      <h2>Système</h2>
      <label class="row switch"><span>Lancer au démarrage de session <small id="login-hint"></small></span><input id="login" type="checkbox" /></label>
      <label class="row switch"><span>Personnalité « Pet » pour toutes les sessions Claude <small>Une ligne 🟧 en tête de chaque réponse</small></span><input id="style" type="checkbox" /></label>
      <div class="row">
        <span>Hooks Claude Code <small id="hooks-state"></small></span>
        <button id="hooks-btn" type="button"></button>
      </div>
    </section>

    <footer>
      <p id="error" role="alert" hidden></p>
      <button id="quit" type="button" class="danger">Quitter pet-claude</button>
    </footer>
  </body>
</html>
