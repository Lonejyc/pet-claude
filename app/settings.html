<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/settings.css" />
    <script type="module" src="/src/settings.ts" defer></script>
    <title>Réglages de pet-claude</title>
  </head>
  <body>
    <header>
      <div class="logo" aria-hidden="true"></div>
      <div>
        <h1>Pet Claude</h1>
        <p>Ton compagnon pour Claude Code</p>
      </div>
    </header>

    <section>
      <h2>Comportement</h2>
      <div class="group">
      <label class="row">
        <span>Le pet reparle après <output id="cooldown-out"></output></span>
        <input id="cooldownSec" type="range" min="0" max="60" step="1" />
      </label>
      <label class="row">
        <span>S'endort après <output id="sleep-out"></output></span>
        <input id="sleepAfterSec" type="range" min="10" max="600" step="10" />
      </label>
      <label class="row switch"><span>Confettis après un gros travail</span><input id="confetti" type="checkbox" switch /></label>
      <label class="row">
        <span>Raccourci du mini-chat <small>Ouvre le chat au centre de l'écran, même pet masqué</small></span>
        <select id="chatShortcut">
          <option value="Control+Alt+Space">⌃⌥ Espace</option>
          <option value="Super+Shift+Space">⌘⇧ Espace</option>
          <option value="Super+Shift+C">⌘⇧ C (pris par d'autres apps)</option>
          <option value="">Désactivé</option>
        </select>
      </label>
      <label class="row">
        <span>Taille du pet <output id="petScale-out"></output></span>
        <input id="petScale" type="range" min="0.7" max="1.5" step="0.05" />
      </label>
      <label class="row switch"><span>Mode furtif pendant les appels <small>Le pet devient tout petit et muet quand ton micro est utilisé (Zoom, Meet, Teams…)</small></span><input id="stealth" type="checkbox" switch /></label>
      <label class="row switch"><span>Emotes au lieu de dormir <small>Six seven, singe à cymbales… (le pet ne dort plus)</small></span><input id="emotes" type="checkbox" switch /></label>
      <label class="row">
        <span>Une emote toutes les <output id="emote-out"></output></span>
        <input id="emoteEverySec" type="range" min="10" max="300" step="5" />
      </label>
      </div>
    </section>

    <section>
      <h2>Apparence</h2>
      <div class="group">
      <div class="row">
        <span>Couleur</span>
        <div id="skin-colors" class="swatches" role="radiogroup"></div>
      </div>
      <label class="row">
        <span>Accessoire</span>
        <select id="skinAccessory"></select>
      </label>
      </div>
    </section>

    <section>
      <h2>Sons</h2>
      <div class="group">
      <label class="row switch"><span>Activer les sons</span><input id="sound" type="checkbox" switch /></label>
      <label class="row">
        <span>Quels sons</span>
        <select id="soundMode">
          <option value="all">Tous</option>
          <option value="alerts">Alertes seulement (erreur, fin de tâche)</option>
        </select>
      </label>
      <label class="row">
        <span>Volume <output id="volume-out"></output></span>
        <input id="volume" type="range" min="0" max="1" step="0.05" />
      </label>
      </div>
    </section>

    <section>
      <h2>Système</h2>
      <div class="group">
      <label class="row switch"><span>Lancer au démarrage de session <small id="login-hint"></small></span><input id="login" type="checkbox" switch /></label>
      <label class="row switch"><span>Personnalité « Pet » pour toutes les sessions Claude <small>Une ligne 🟧 en tête de chaque réponse</small></span><input id="style" type="checkbox" switch /></label>
      <div class="row">
        <span>Hooks Claude Code <small id="hooks-state"></small></span>
        <button id="hooks-btn" type="button"></button>
      </div>
      </div>
    </section>

    <footer>
      <p id="error" role="alert" hidden></p>
      <button id="quit" type="button">Quitter pet-claude</button>
    </footer>
  </body>
</html>
